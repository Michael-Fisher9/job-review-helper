<!DOCTYPE html>
<html>
<head>
  <title>Loading Reviews</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }
    .loader-container {
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1.5s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .company-name {
      font-weight: bold;
      color: #3498db;
      margin: 10px 0;
      font-size: 18px;
    }
    .message {
      margin-top: 20px;
      font-size: 14px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <h2>Loading Company Reviews</h2>
    <div class="loader"></div>
    <p>Please wait while we fetch the latest reviews...</p>
    <p class="message">This window will automatically close when the reviews are ready.</p>
  </div>

  <script>
    // This window will be closed by the background script when the actual review page loads
    // We'll automatically close this window after 10 seconds as a fallback
    setTimeout(() => {
      window.close();
    }, 10000);
  </script>
</body>
</html>
